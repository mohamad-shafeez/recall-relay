<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="1200" height="280" role="img" aria-label="RecallRelay: One recall. Multiple organizations. Coordinated response." xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#FFF8F3"/>
      <stop offset="1" stop-color="#F4DED2"/>
    </linearGradient>
    <clipPath id="round"><rect width="1200" height="280" rx="22"/></clipPath>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="280" fill="url(#bg)"/>
    <rect width="16" height="280" fill="#702B3A"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <text x="70" y="128" font-size="76" font-weight="700" fill="#4A1F2B">RecallRelay</text>
    <text x="72" y="182" font-size="29" font-weight="600" fill="#702B3A">One recall. Multiple organizations. Coordinated response.</text>
    <text x="72" y="228" font-size="21" fill="#7A6870">Evidence first. Honest about what is unknown. Humans decide.</text>
  </g>

  <!-- simple picture: one recall in the middle, three organizations around it -->
  <g stroke="#702B3A" stroke-width="3" stroke-linecap="round" opacity="0.55">
    <line x1="985" y1="140" x2="900" y2="70"/>
    <line x1="985" y1="140" x2="1085" y2="70"/>
    <line x1="985" y1="140" x2="985" y2="228"/>
  </g>
  <circle cx="985" cy="140" r="38" fill="#702B3A"/>
  <text x="985" y="150" text-anchor="middle" font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="30" font-weight="700" fill="#FFFFFF">R</text>

  <g fill="#FFFFFF" stroke="#702B3A" stroke-width="3">
    <circle cx="900" cy="70" r="26"/>
    <circle cx="1085" cy="70" r="26"/>
    <circle cx="985" cy="228" r="26"/>
  </g>
  <g font-family="Segoe UI, Helvetica, Arial, sans-serif" font-size="15" font-weight="600" fill="#4A1F2B" text-anchor="middle">
    <text x="900" y="112">Maker</text>
    <text x="1085" y="112">Store</text>
    <text x="985" y="270">Distributor</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
