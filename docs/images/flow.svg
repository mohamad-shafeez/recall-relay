<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 650" width="1200" height="650" role="img" aria-label="The nine steps of one coordinated response, from fetching the official notice to asking a person to approve" xmlns:c2pa="http://c2pa.org/manifest">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#702B3A"/>
    </marker>
  </defs>

  <rect width="1200" height="650" rx="22" fill="#FFF8F3"/>

  <!-- connectors inside each row -->
  <g stroke="#702B3A" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <line x1="382" y1="115" x2="426" y2="115"/>
    <line x1="772" y1="115" x2="816" y2="115"/>
    <line x1="382" y1="325" x2="426" y2="325"/>
    <line x1="772" y1="325" x2="816" y2="325"/>
    <line x1="382" y1="535" x2="426" y2="535"/>
    <line x1="772" y1="535" x2="816" y2="535"/>
  </g>
  <!-- connectors from the end of one row to the start of the next -->
  <g stroke="#702B3A" stroke-width="3" fill="none" marker-end="url(#arrow)">
    <path d="M990 190 V212 H210 V240"/>
    <path d="M990 400 V422 H210 V450"/>
  </g>

  <g font-family="Segoe UI, Helvetica, Arial, sans-serif">
    <!-- Row 1 -->
    <rect x="40" y="40" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#702B3A" stroke-width="3"/>
    <circle cx="76" cy="76" r="18" fill="#702B3A"/><text x="76" y="83" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">1</text>
    <text x="106" y="82" font-size="23" font-weight="700" fill="#4A1F2B">Get the official notice</text>
    <text x="64" y="125" font-size="18" fill="#32252A">Fetch the fda.gov page and</text>
    <text x="64" y="150" font-size="18" fill="#32252A">save its fingerprint</text>

    <rect x="430" y="40" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#702B3A" stroke-width="3"/>
    <circle cx="466" cy="76" r="18" fill="#702B3A"/><text x="466" y="83" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">2</text>
    <text x="496" y="82" font-size="23" font-weight="700" fill="#4A1F2B">Extract the facts</text>
    <text x="454" y="125" font-size="18" fill="#32252A">Product, hazard and dates.</text>
    <text x="454" y="150" font-size="18" fill="#32252A">Conflicting dates are flagged</text>

    <rect x="820" y="40" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#702B3A" stroke-width="3"/>
    <circle cx="856" cy="76" r="18" fill="#702B3A"/><text x="856" y="83" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">3</text>
    <text x="886" y="82" font-size="23" font-weight="700" fill="#4A1F2B">Lyzr reads the notice</text>
    <text x="844" y="125" font-size="18" fill="#32252A">The AI returns the same</text>
    <text x="844" y="150" font-size="18" fill="#32252A">fields as JSON</text>

    <!-- Row 2 -->
    <rect x="40" y="250" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#702B3A" stroke-width="3"/>
    <circle cx="76" cy="286" r="18" fill="#702B3A"/><text x="76" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">4</text>
    <text x="106" y="292" font-size="23" font-weight="700" fill="#4A1F2B">Check every fact</text>
    <text x="64" y="335" font-size="18" fill="#32252A">Each value must appear word</text>
    <text x="64" y="360" font-size="18" fill="#32252A">for word in the notice</text>

    <rect x="430" y="250" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#702B3A" stroke-width="3"/>
    <circle cx="466" cy="286" r="18" fill="#702B3A"/><text x="466" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">5</text>
    <text x="496" y="292" font-size="23" font-weight="700" fill="#4A1F2B">Work out the scope</text>
    <text x="454" y="335" font-size="18" fill="#32252A">Which batches are covered.</text>
    <text x="454" y="360" font-size="18" fill="#32252A">Unknown stays unknown</text>

    <rect x="820" y="250" width="340" height="150" rx="16" fill="#F4DED2" stroke="#702B3A" stroke-width="3"/>
    <circle cx="856" cy="286" r="18" fill="#702B3A"/><text x="856" y="293" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">6</text>
    <text x="886" y="292" font-size="23" font-weight="700" fill="#4A1F2B">Look for records</text>
    <text x="844" y="335" font-size="18" fill="#32252A">Maker, distributor and store.</text>
    <text x="844" y="360" font-size="18" fill="#32252A">BLOCKED if none are shared</text>

    <!-- Row 3 -->
    <rect x="40" y="460" width="340" height="150" rx="16" fill="#F4DED2" stroke="#702B3A" stroke-width="3"/>
    <circle cx="76" cy="496" r="18" fill="#702B3A"/><text x="76" y="503" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">7</text>
    <text x="106" y="502" font-size="23" font-weight="700" fill="#4A1F2B">Agents talk on BAND</text>
    <text x="64" y="545" font-size="18" fill="#32252A">The Scope agent hands off to</text>
    <text x="64" y="570" font-size="18" fill="#32252A">the Verification agent</text>

    <rect x="430" y="460" width="340" height="150" rx="16" fill="#FFFFFF" stroke="#702B3A" stroke-width="3"/>
    <circle cx="466" cy="496" r="18" fill="#702B3A"/><text x="466" y="503" text-anchor="middle" font-size="20" font-weight="700" fill="#FFFFFF">8</text>
    <text x="496" y="502" font-size="23" font-weight="700" fill="#4A1F2B">Double-check</text>
    <text x="454" y="545" font-size="18" fill="#32252A">Conflicts are flagged. No</text>
    <text x="454" y="570" font-size="18" fill="#32252A">evidence means "awaiting"</text>

    <rect x="820" y="460" width="340" height="150" rx="16" fill="#702B3A" stroke="#4A1F2B" stroke-width="3"/>
    <circle cx="856" cy="496" r="18" fill="#FFF8F3"/><text x="856" y="503" text-anchor="middle" font-size="20" font-weight="700" fill="#702B3A">9</text>
    <text x="886" y="502" font-size="23" font-weight="700" fill="#FFFFFF">Ask a person</text>
    <text x="844" y="545" font-size="18" fill="#FFF8F3">A PENDING approval. Agents</text>
    <text x="844" y="570" font-size="18" fill="#FFF8F3">never approve themselves</text>
  </g>
<metadata><c2pa:manifest></c2pa:manifest></metadata></svg>
